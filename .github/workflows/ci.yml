name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PATHLEDGER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build dashboard
        run: make web
      - name: Verify modules
        run: go mod verify
      - name: Lint
        run: make lint
      - name: Allow unprivileged ICMP for probe tests
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - name: Unit, integration and API tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: End-to-end
        env:
          PATHLEDGER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pathledger_e2e?sslmode=disable
        run: |
          psql "postgres://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE pathledger_e2e"
          make e2e
      - name: Cross-compile agent
        run: make dist

  lab:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
      - name: Install lab dependencies
        run: sudo pip install --break-system-packages pyroute2
      - name: Run fault-injection lab
        env:
          PATHLEDGER_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pathledger_lab?sslmode=disable
        run: |
          psql "postgres://postgres:postgres@127.0.0.1:5432/postgres" -c "CREATE DATABASE pathledger_lab"
          sudo env PATHLEDGER_DATABASE_URL="$PATHLEDGER_DATABASE_URL" python3 -u lab/faultlab.py --bin ./bin --out lab/results.md
      - name: Publish lab results
        if: always()
        run: test -f lab/results.md && cat lab/results.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fault-lab-results
          path: lab/results.md
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build controller image
        run: docker build -f deploy/docker/Dockerfile --build-arg BINARY=pathledger-controller -t pathledger-controller:ci .
      - name: Build agent image
        run: docker build -f deploy/docker/Dockerfile --build-arg BINARY=pathledger-agent -t pathledger-agent:ci .
      - name: Smoke-test images
        run: |
          docker run --rm pathledger-controller:ci version
          docker run --rm pathledger-agent:ci -version
      - name: Compose stack comes up and serves /readyz
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build --wait
          curl -fsS http://127.0.0.1:8080/readyz
          docker compose -f deploy/docker-compose.yml exec -T controller app tenant create -name "CI tenant" | grep -q "api key: plk_"
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs

  # The agent runs on ordinary computers, so test it on each desktop/server
  # OS: unit tests, then the real installer as a background service against a
  # real controller, until ICMP, TCP and traceroute results arrive.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          echo "PG_URL=postgres://postgres:postgres@127.0.0.1:5432" >> "$GITHUB_ENV"
      - name: Start PostgreSQL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@16
          brew services start postgresql@16
          for i in $(seq 1 30); do "$(brew --prefix postgresql@16)/bin/pg_isready" -h 127.0.0.1 && break; sleep 2; done
          echo "PG_URL=postgres://$USER@127.0.0.1:5432" >> "$GITHUB_ENV"
      - name: Start PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $svc = Get-Service -Name "postgresql*"
          Set-Service -InputObject $svc -Status Running -StartupType Automatic
          & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1 -t 60
          "PG_URL=postgres://postgres:root@127.0.0.1:5432" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Create databases
        shell: bash
        run: |
          go run ./scripts/createdb "$PG_URL/postgres?sslmode=disable" pathledger_install
      - name: Tests
        shell: bash
        env:
          PATHLEDGER_TEST_DATABASE_URL: ${{ env.PG_URL }}/postgres?sslmode=disable
        run: go test -count=1 ./...
      - name: Build
        shell: bash
        run: go build -o bin/ ./cmd/pathledger-controller ./cmd/pathledger-agent
      - name: Install agent as a service and check results (Linux, macOS)
        if: runner.os != 'Windows'
        run: sudo env PATHLEDGER_DATABASE_URL="$PG_URL/pathledger_install?sslmode=disable" python3 -u scripts/install_e2e.py --bin bin
      - name: Install agent as a service and check results (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATHLEDGER_DATABASE_URL = "$env:PG_URL/pathledger_install?sslmode=disable"
          python -u scripts/install_e2e.py --bin bin
