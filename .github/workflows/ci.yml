name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PATHLEDGER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Lint
        run: make lint
      - name: Allow unprivileged ICMP for probe tests
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - name: Unit, integration and API tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: End-to-end
        env:
          PATHLEDGER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pathledger_e2e?sslmode=disable
        run: |
          psql "postgres://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE pathledger_e2e"
          make e2e
      - name: Cross-compile agent
        run: make dist

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build controller image
        run: docker build -f deploy/docker/Dockerfile --build-arg BINARY=pathledger-controller -t pathledger-controller:ci .
      - name: Build agent image
        run: docker build -f deploy/docker/Dockerfile --build-arg BINARY=pathledger-agent -t pathledger-agent:ci .
      - name: Smoke-test images
        run: |
          docker run --rm pathledger-controller:ci version
          docker run --rm pathledger-agent:ci -version
      - name: Compose stack comes up and serves /readyz
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build --wait
          curl -fsS http://127.0.0.1:8080/readyz
          docker compose -f deploy/docker-compose.yml exec -T controller app tenant create -name "CI tenant" | grep -q "api key: plk_"
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
